# Production stack: Postgres + API + web (Caddy, HTTPS) + daily backups.
# Copy .env.example to .env and fill it in first; see docs/deploy.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taxi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://taxi:${POSTGRES_PASSWORD}@db:5432/taxi
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      TRUST_PROXY: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      retries: 3

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Certificates live here; losing them only means Caddy fetches new ones.
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: taxi
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: taxi
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/usr/local/bin/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups

volumes:
  pgdata:
  caddy_data:
  caddy_config:
