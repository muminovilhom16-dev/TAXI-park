# Production-like stack: Postgres + API + web (Caddy). Copy .env.example to .env first.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taxi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://taxi:${POSTGRES_PASSWORD}@db:5432/taxi
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

volumes:
  pgdata:
